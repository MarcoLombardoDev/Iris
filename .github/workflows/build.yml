name: Build

# Builds the single-file Windows executable with PyInstaller (build.py).
# PyInstaller does not cross-compile: this only runs on windows-latest, and
# is the only way to produce a real Iris.exe without a Windows machine.
#
# - workflow_dispatch: build on demand, from the Actions tab or the API.
#   The executable is attached to the run as a downloadable artifact.
# - push of a "v*" tag: same build, additionally attached to the matching
#   GitHub Release, which — unlike a workflow artifact — never expires.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    name: Windows executable
    runs-on: windows-latest
    # softprops/action-gh-release needs write access to create the release
    # and upload the asset; the default token is often read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest tests -v

      - name: Build the executable
        run: python build.py

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: Iris-windows-exe
          path: dist/Iris.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Iris ${{ github.ref_name }}
          body: |
            Windows executable for Iris ${{ github.ref_name }}. Download `Iris.exe` below —
            no installation required.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)
            for what changed in this release.
          files: dist/Iris.exe

      # Belt and braces: softprops/action-gh-release updates an existing
      # release's title/notes too, but a release first created by hand (or
      # by an older run of this workflow, before this step existed) can keep
      # a stale title. Force it explicitly so a re-run always corrects it.
      - name: Ensure the release title and notes are correct
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --title "Iris ${{ github.ref_name }}" \
            --notes "Windows executable for Iris ${{ github.ref_name }}. Download Iris.exe below — no installation required. See CHANGELOG.md for what changed in this release."
